---
include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/artifacts/python-library.yaml

variables:
  LANGUAGE_VERSION: python3.10

tox:
  parallel:
    matrix:
      - LANGUAGE_VERSION:
          - python3.10
          - python3.11
          - python3.12
          - python3.13
          - python3.14
        SQLALCHEMY:
          - sqlalchemy1.4
          - sqlalchemy2
  services:
    - name: docker.osdc.io/ncigdc/ci-postgres-18:latest
      alias: postgres
      variables:
        POSTGRES_DB: automated_test
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
        POSTGRES_HOST_AUTH_METHOD: trust
  variables:
    PG_HOST: postgres
  script:
    - uv tool run tox -r -e py-${SQLALCHEMY}
