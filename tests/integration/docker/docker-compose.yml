---
services:
  postgres:
    image: docker.osdc.io/ncigdc/ci-postgres-13:latest
    hostname: postgres.service.local
    # fixes mac m2 manifest issue
    platform: linux/amd64
    environment:
      POSTGRES_PASS: test
      POSTGRES_HOST_AUTH_METHOD: trust
      PG_INIT_SQL: |
        create user test with superuser password 'test';
        create database automated_test with owner test;
    ports:
      - '5432'
    healthcheck:
      test: [CMD-SHELL, pg_isready]
      interval: 5s
      timeout: 5s
      retries: 5
